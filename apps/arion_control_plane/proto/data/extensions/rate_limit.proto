syntax = "proto3";

package data.extensions;

import "data/http_status.proto";
import "data/token_bucket.proto";

message LocalRateLimit {
  // maps to "envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit"

  string stat_prefix = 1;
   data.HttpStatus status = 2;
   data.TokenBucket token_bucket = 3;
  bool local_rate_limit_per_downstream_connection = 11;

  reserved 4 to 6, 8 to 9, 12 to 15;
  reserved "filter_enabled", "filter_enforced", "request_headers_to_add_when_not_enforced", "response_headers_to_add", "descriptors", "stage", "enable_x_ratelimit_headers", "vh_rate_limits", "always_consume_default_token_bucket", "rate_limited_as_resource_exhausted";
}

message ListenerLocalRateLimit {
  // maps to "envoy.extensions.filters.listener.local_ratelimit.v3.LocalRateLimit"

  string stat_prefix = 1;
   data.TokenBucket token_bucket = 2;

  reserved 3;
  reserved "runtime_enabled";
}
