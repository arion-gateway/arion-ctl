syntax = "proto3";

package data;


message Int64Range {
  // maps to "envoy.type.v3.Int64Range";
  int64 start = 1;
  int64 end = 2;
}

message Int32Range {
  // maps to "envoy.type.v3.Int32Range";
  int32 start = 1;
  int32 end = 2;
}

message DoubleRange {
  // maps to "envoy.type.v3.DoubleRange";
  double start = 1;
  double end = 2;
}
