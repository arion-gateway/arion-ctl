syntax = "proto3";

package data;

message SocketOption {
  // maps to "envoy.core.v3.SocketOption"

  enum SocketState {
    STATE_PREBIND = 0;
    STATE_BOUND = 1;
    STATE_LISTENING = 2;
  }

  string description = 1;
  int64 level = 2;
  int64 name = 3;

  oneof value {
    int64 int_value = 4;
    bytes buf_value = 5;
  }

  reserved 6;
  reserved "state";
}

message SocketOptionsOverride {
  repeated SocketOption socket_options = 1;
}
