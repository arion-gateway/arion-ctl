syntax = "proto3";

package data;

import "data/string.proto";

enum RequestMethod {
  METHOD_UNSPECIFIED = 0;
  GET = 1;
  HEAD = 2;
  POST = 3;
  PUT = 4;
  DELETE = 5;
  CONNECT = 6;
  OPTIONS = 7;
  TRACE = 8;
  PATCH = 9;
}


message PathMatcher {
  // maps to "envoy.type.matcher.v3.PathMatcher"

  oneof rule {
     data.StringMatcher path = 1;
  }
}