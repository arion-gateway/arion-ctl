syntax = "proto3";

package data;

import "google/protobuf/any.proto";
import "data/node.proto";
import "data/resource.proto";
import "data/grpc_status.proto";


message DiscoveryRequest {
  // maps to "envoy.service.discovery.v3.DiscoveryRequest";

  string version_info = 1;
   data.Node node = 2;
  repeated string resource_names = 3;
  string type_url = 4;
  string response_nonce = 5;
   data.Status error_detail = 6;

  reserved 7;
  reserved "resource_locators";
}

message DiscoveryResponse {
  // maps to "envoy.service.discovery.v3.DiscoveryResponse";

  string version_info = 1;
  repeated google.protobuf.Any resources = 2;
  string type_url = 4;
  string nonce = 5;

  reserved 3, 6;
  reserved "canary", "control_plane";
}

message DeltaDiscoveryRequest {
  // maps to "envoy.service.discovery.v3.DeltaDiscoveryRequest";

   data.Node node = 1;
  string type_url = 2;
  repeated string resource_names_subscribe = 3;
  repeated string resource_names_unsubscribe = 4;
  map<string, string> initial_resource_versions = 5;
  string response_nonce = 6;
   data.Status error_detail = 7;

  reserved 8, 9;
  reserved "resource_locators_subscribe", "resource_locators_unsubscribe";
}

message DeltaDiscoveryResponse {
  // maps to "envoy.service.discovery.v3.DeltaDiscoveryResponse";

  string system_version_info = 1;
  repeated  data.Resource resources = 2;
  string type_url = 4;
  string nonce = 5;
  repeated string removed_resources = 6;

  reserved 7, 8;
  reserved "control_plane", "removed_resource_names";
}
