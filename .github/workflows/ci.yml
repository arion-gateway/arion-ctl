name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [arion_control_plane, arion_ctl, arion_k8s_controller]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.2'
          elixir-version: '1.20.2'
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix test
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.6
      - run: helm lint charts/arion-ctl && helm template arion-ctl charts/arion-ctl --namespace arion-system --include-crds > /tmp/chart.yaml
