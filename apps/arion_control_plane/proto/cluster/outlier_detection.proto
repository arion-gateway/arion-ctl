syntax = "proto3";

package cluster;

import "google/protobuf/wrappers.proto";
import "google/protobuf/duration.proto";

message OutlierDetection {
  // maps to "envoy.config.cluster.v3.OutlierDetection"

  google.protobuf.UInt32Value consecutive_5xx = 1;
  google.protobuf.Duration interval = 2;
  google.protobuf.Duration base_ejection_time = 3;
  google.protobuf.UInt32Value max_ejection_percent = 4;

  reserved 5 to 23;
  reserved "enforcing_success_rate", "enforcing_consecutive_5xx", "consecutive_gateway_failure", "success_rate_stdev_factor", "success_rate_request_volume", "success_rate_minimum_hosts", "enforcing_consecutive_gateway_failure", "enforcing_local_origin_success_rate", "enforcing_consecutive_local_origin_failure", "consecutive_local_origin_failure", "split_external_local_origin_errors", "failure_percentage_threshold", "enforcing_failure_percentage", "enforcing_failure_percentage_local_origin", "failure_percentage_minimum_hosts", "failure_percentage_request_volume", "max_ejection_time", "max_ejection_time_jitter", "successful_active_health_check_uneject_host";
}
