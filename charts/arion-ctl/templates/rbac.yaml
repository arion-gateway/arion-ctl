apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "arion.name" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "arion.name" . }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
      - tlsroutes
      - tcproutes
      - udproutes
      - referencegrants
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses/status
      - gateways/status
      - httproutes/status
      - grpcroutes/status
      - tlsroutes/status
      - tcproutes/status
      - udproutes/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "secrets", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Service backend endpoints.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # ArionGatewayParameters parametersRef target.
  - apiGroups: ["arion.io"]
    resources: ["ariongatewayparameters"]
    verbs: ["get", "list", "watch"]
  # libcluster discovers peers via endpoints/pods; Highlander avoids Lease RBAC.
  # Pods are also InferencePool endpoints.
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  # Provision data planes and watch readiness for Gateway Programmed status.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ConfigMaps and ServiceAccounts are not watched: the Deployer reads them back
  # on its verification tick to repair drift.
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "arion.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "arion.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "arion.name" . }}
    namespace: {{ .Release.Namespace }}
