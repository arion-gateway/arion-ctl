apiVersion: arion.io/v1alpha1
kind: ArionGatewayParameters
metadata:
  name: edge-settings
  namespace: default
spec:
  replicas: 2
  serviceType: ClusterIP
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: default
spec:
  gatewayClassName: arion
  infrastructure:
    parametersRef:
      group: arion.io
      kind: ArionGatewayParameters
      name: edge-settings
  listeners:
    - name: http
      protocol: HTTP
      port: 80
