name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
env:
  PROXY_IMAGE: ghcr.io/arion-gateway/arion:0.1.0
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.2'
          elixir-version: '1.20.2'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.6
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - name: Unit tests and release
        run: |
          for app in arion_control_plane arion_ctl arion_k8s_controller; do
            (cd "apps/$app" && mix deps.get --check-locked && mix format --check-formatted && mix test)
          done
          (cd apps/arion_ctl && MIX_ENV=prod mix release)
      - name: Verify external tagged dependency
        env:
          ARION_CTL_TAG: ${{ github.ref_name }}
        run: bin/verify-consumer
      - name: Test packaged CLI against released Arion
        run: |
          docker pull "$PROXY_IMAGE"
          container=$(docker create "$PROXY_IMAGE")
          docker cp "$container:/arion" /tmp/arion
          docker rm "$container"
          python3 scripts/smoke.py --release apps/arion_ctl/_build/prod/rel/arion_ctl --proxy /tmp/arion
  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: arion_ctl
            image: arion-ctl
          - app: arion_k8s_controller
            image: arion-ctl-controller
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/arion-gateway/${{ matrix.image }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
  integration:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.6
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test published images in kind
        env:
          BUILD_IMAGES: 'false'
          ARION_IMAGE: ${{ env.PROXY_IMAGE }}
          CONFORMANCE_VERSION: ${{ github.ref_name }}
        run: |
          export CONTROLLER_IMAGE="ghcr.io/arion-gateway/arion-ctl-controller:${GITHUB_REF_NAME#v}"
          apps/arion_k8s_controller/conformance/run.sh all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: apps/arion_k8s_controller/conformance/reports
  chart:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.6
      - name: Publish chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm lint charts/arion-ctl
          helm package charts/arion-ctl --version "$version" --app-version "$version"
          helm push "arion-ctl-$version.tgz" oci://ghcr.io/arion-gateway/charts
